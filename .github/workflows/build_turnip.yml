name: Build Turnip A8xx OnePlus 15 (Android 17)

on:
  workflow_dispatch:
    inputs:
      mesa_branch:
        description: 'Mesa GitLab branch to build from'
        required: false
        default: 'staging/26.3'
        type: string
      mesa_commit:
        description: 'Optional pinned Mesa commit SHA (leave empty for branch HEAD)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mesa_commit: ${{ steps.mesa.outputs.commit }}
      mesa_branch: ${{ steps.mesa.outputs.branch }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_name: ${{ steps.release.outputs.name }}
    steps:
      - name: Resolve Mesa branch commit
        id: mesa
        env:
          INPUT_BRANCH: ${{ inputs.mesa_branch || 'staging/26.3' }}
          INPUT_COMMIT: ${{ inputs.mesa_commit }}
        run: |
          BRANCH="$INPUT_BRANCH"
          if [ -n "$INPUT_COMMIT" ]; then
            COMMIT="$INPUT_COMMIT"
          else
            COMMIT=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git "refs/heads/$BRANCH" | awk '{print $1}')
            if [ -z "$COMMIT" ]; then
              echo "Branch $BRANCH not found, falling back to main"
              BRANCH="main"
              COMMIT=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
            fi
          fi
          test -n "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved Mesa $BRANCH commit: $COMMIT"

      - name: Set release metadata
        id: release
        run: |
          DATE=$(date -u +'%Y.%m.%d')
          HUMAN_DATE=$(date -u +'%Y-%m-%d')
          echo "tag=v${DATE}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=Turnip A840 OnePlus 15 SuperOpt (Mesa 26.3 / Android 17) - ${HUMAN_DATE}" >> "$GITHUB_OUTPUT"

  prepare_release:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Create or refresh draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.resolve.outputs.release_name }}
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
          MESA_BRANCH: ${{ needs.resolve.outputs.mesa_branch }}
        run: |
          cat > release-notes.md <<EOF
          Custom Android 17 (API 37) Turnip A8xx/A840 SuperOpt drivers built for **OnePlus 15 (Snapdragon 8 Elite Gen 5 / Adreno 840)** from Mesa \`${MESA_BRANCH}\` (\`${MESA_COMMIT}\`):

          - **Turnip A840 OnePlus 15 Ultra (Eco + High FPS)**: Best balance of high framerate and low battery/thermal drain for Dying Light 1/2/The Beast. Includes 18 MB HPM smart autotune, Turnip-Z Mutable UBWC compression, Vauzi-17 LRZ preservation across FS side-effect draws, IR3 live-register pressure scheduler optimization, dynamic draw-state deduplication, 0001-0005 DX12U patches, and Oryon Gen 3 (\`armv9.2-a\`) optimizations.
          - **Turnip A840 OnePlus 15 MaxPerf (WinNative-P PWR_MAX)**: Locks Adreno 840 to peak clocks via \`KGSL_PROP_PWR_CONSTRAINT = PWR_MAX\` with aggressive 18 MB HPM GMEM retention for maximum benchmark/heavy-scene FPS.
          - **Turnip A8xx Gen8 (OP15)**: whitebelyash Gen8 stack (\`TU_DEBUG=nocb\` by default + \`TU_DEBUG=deck_emu\` support) combined with 100% vec4 register unlock, 0001-0005 patches, and the OnePlus 15 SuperOpt suite.

          All A7xx and Samsung OneUI legacy patches have been stripped.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release already exists; refreshing notes for retry."
            gh release edit "$RELEASE_TAG" --draft --title "$RELEASE_NAME" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_NAME" --notes-file release-notes.md --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

  build:
    needs: [resolve, prepare_release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a8xx-oneplus15-ultra
            artifact: Turnip-A840-OnePlus15-Ultra
          - variant: a8xx-oneplus15-max
            artifact: Turnip-A840-OnePlus15-MaxPerf
          - variant: a8xx-gen8
            artifact: Turnip-A8xx-Gen8-OP15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@main
        with:
          path: turnip_workdir/android-ndk-*
          key: android-ndk-r30-linux-v1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            patch \
            clang \
            lld \
            llvm
          pip3 install --break-system-packages --upgrade meson mako pyyaml packaging

      - name: Build ${{ matrix.artifact }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ github.run_number }}
          MESA_BRANCH: ${{ needs.resolve.outputs.mesa_branch }}
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify ZIP
        run: |
          echo "Generated files:"
          find turnip_workdir -maxdepth 1 -type f -name "Turnip_*.zip" -print
          test "$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_*.zip' | wc -l)" -eq 1
          unzip -t turnip_workdir/Turnip_*.zip
          unzip -p turnip_workdir/Turnip_*.zip meta.json | python3 -m json.tool

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.artifact }}
          path: turnip_workdir/Turnip_*.zip

      - name: Upload ${{ matrix.artifact }} directly to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          ZIP="$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_*.zip' -print -quit)"
          test -n "$ZIP"
          test -f "$ZIP"
          echo "Uploading $ZIP directly to release $RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

  release:
    needs: [resolve, prepare_release, build]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all three A8xx release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          echo "Release assets: $ASSET_COUNT"
          test "$ASSET_COUNT" -eq 3

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --repo "$GITHUB_REPOSITORY"
